# GoReleaser config for nova CLI
# Docs: https://goreleaser.com

version: 2

project_name: nova

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

archives:
  - format: tar.gz
    # No version in the name: README links to releases/latest/download/<name>,
    # which only resolves for a stable asset name.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: quyennguyenvu
    name: nova
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
